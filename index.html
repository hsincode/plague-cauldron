<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1720">
<title>Plague Cauldron</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1720'/%3E%3Ccircle cx='10.5' cy='7' r='2.6' fill='%2324c8d8'/%3E%3Ccircle cx='19.5' cy='4.6' r='1.8' fill='%2324c8d8'/%3E%3Cpath d='M4.5 14h23l-1.8 8.6a7 7 0 0 1-6.9 5.6h-5.6a7 7 0 0 1-6.9-5.6z' fill='%233a424d'/%3E%3Cellipse cx='16' cy='14' rx='12.5' ry='3.8' fill='%23697584'/%3E%3Cellipse cx='16' cy='14.2' rx='9.8' ry='2.5' fill='%2324c8d8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/app.css">
</head>
<body>
<div id="app">
  <div id="frame">
    <canvas id="c"></canvas>
    <div id="title" class="overlay no-joy">
      <div class="title-card">
        <h1>PLAGUE<br>CAULDRON</h1>
        <p class="sub">疫病の大釜</p>
        <button id="start" type="button" disabled>はじめる</button>
        <p class="help">ドラッグ / WASD・矢印キーで移動。<br>あとは近づくだけ。</p>
      </div>
    </div>
    <div id="win" class="overlay no-joy" hidden>
      <div class="title-card">
        <h1>疫病は去った</h1>
        <p class="sub" id="win-stats"></p>
        <button id="again" type="button">もう一度</button>
      </div>
    </div>
    <button id="mute" class="no-joy" type="button" aria-label="サウンド">♪</button>
  </div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
